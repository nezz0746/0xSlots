type SettledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  taxOwed: BigInt!
  taxPaid: BigInt!
  depositRemaining: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
One tax payment, attributed to the address that paid it.

`SettledEvent` carries the same amounts but not the payer, so it cannot be
reduced to a per-address ledger. This can, and it is the contract's own
statement rather than an inference from event ordering.
"""
type TaxPaidEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  account: Account!
  accountSlot: AccountSlot!
  currency: Currency!
  taxOwed: BigInt!
  """Actually taken from the deposit. Diverges from taxOwed when the occupant
  went insolvent, since the charge is capped at the remaining deposit — this is
  the figure to use for contribution accounting, never taxOwed."""
  taxPaid: BigInt!
  """False when the payer disagreed with the occupant the subgraph had on
  record. Always false today; a true value means the ordering assumption behind
  the pre-TaxPaid attribution has broken and older totals are suspect."""
  matchedOccupant: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type TaxCollectedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  recipient: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type ModuleFeePaidEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  module: Module!
  amount: BigInt!
  feeBps: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type TaxUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPercentage: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type ModuleUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
