# ──────────────────────────────────────────
# 0xSlots v3 Subgraph Schema
# One slot = one contract (BeaconProxy)
# ──────────────────────────────────────────

type Factory @entity(immutable: false) {
  id: ID! # factory proxy address
  slotCount: BigInt!
  modules: [Module!]! @derivedFrom(field: "factory")
}

enum AccountType {
  EOA
  CONTRACT
  DELEGATED
  SPLIT
}

type Account @entity(immutable: false) {
  id: ID! # address (lowercase)
  type: AccountType!
  slotsAsRecipient: [Slot!]! @derivedFrom(field: "recipientAccount")
  slotsAsOccupant: [Slot!]! @derivedFrom(field: "occupantAccount")
  slotCount: Int!
  occupiedCount: Int!
  # feed metadata activity
  metadataUpdateCount: BigInt!
  # hold aggregate (tax is per-slot since currency is immutable per slot)
  totalHoldTime: BigInt! # cumulative seconds holding any slot
  # per-slot breakdown
  slotInteractions: [AccountSlot!]! @derivedFrom(field: "account")
}

type AccountSlot @entity(immutable: false) {
  id: ID! # {accountAddress}-{slotAddress}
  account: Account!
  slot: Slot!
  metadataUpdateCount: BigInt!
  taxPaid: BigInt!
  holdTime: BigInt! # total seconds held this slot
  lastOccupiedAt: BigInt # null if not currently holding
  firstInteractedAt: BigInt!
  lastInteractedAt: BigInt!
}

type Currency @entity(immutable: true) {
  id: ID! # token address (lowercase)
  name: String
  symbol: String
  decimals: Int!
}

type Slot @entity(immutable: false) {
  id: ID! # slot contract address (lowercase)
  recipient: Bytes!
  recipientAccount: Account!
  currency: Currency!
  mutableTax: Boolean!
  mutableModule: Boolean!
  mutablePolicy: Boolean!
  manager: Bytes!
  taxPercentage: BigInt!
  module: Module
  liquidationBountyBps: BigInt!
  minDepositSeconds: BigInt!
  occupant: Bytes # null = vacant
  occupantAccount: Account # null = vacant
  isOccupied: Boolean! # mirrors occupant != null; sortable/filterable
  feed: Feed # null if this slot does not belong to a Feed
  price: BigInt!
  deposit: BigInt!
  collectedTax: BigInt!
  """Total tax ever paid into this slot, summed from TaxPaid.
  The denominator for an account's share; unlike collectedTax it
  only grows, since collecting drains the balance but not history."""
  taxPaidTotal: BigInt!
  totalCollected: BigInt!

  # ── v3 occupancy layer ───────────────────────────────────────────────────
  # Sourced from SlotConfiguredV3, which initializeV3/migrateSlotsV3 emit.
  # SlotDeployed predates both and carries neither.
  epochSeconds: BigInt!
  occupancyPolicy: Bytes # null = no policy, i.e. plain instant buy
  occupiedSince: BigInt!

  # Committed-but-not-yet-effective transfer (epochSeconds > 0 only).
  #
  # IMPORTANT FOR CONSUMERS: `occupant` above is the last MATERIALISED
  # occupant. Transfers apply lazily on-chain — nothing runs at the boundary —
  # so once `block.timestamp >= pendingEffectiveAt`, the chain already treats
  # `pendingBuyer` as the occupant while this entity still shows the old one,
  # until some transaction touches the slot.
  #
  # The subgraph cannot resolve this itself: GraphQL has no notion of "now" at
  # query time. Callers must compute effective occupancy client-side —
  # `@0xslots/sdk` exports `resolveEffectiveOccupancy` for exactly this.
  pendingBuyer: Bytes
  pendingEffectiveAt: BigInt
  pendingPrice: BigInt
  pendingDeposit: BigInt

  # ── Pending manager-proposed updates, one per dimension ──────────────────
  #
  # A slot holds at most three queued changes — tax, utility, policy — and all
  # of them apply together on the next ownership transition. Each can be
  # proposed and cancelled independently.
  #
  # NULL means nothing is queued for that dimension. That is NOT the same as
  # the zero address, which is a real proposed value for the two address
  # dimensions: "remove the utility" and "drop the occupancy policy" are both
  # changes someone deliberately queued. Read the value, not its truthiness.
  #
  # The `*ProposedAt` stamps are what separate a change queued last week from
  # one queued moments before a buy — a distinction a buyer needs and the
  # `has*` flags cannot express. Null when nothing is queued; also null for
  # the handful of updates queued before the contract recorded the time.
  pendingPolicy: Bytes
  hasPendingPolicy: Boolean!
  policyProposedAt: BigInt
  pendingTaxPercentage: BigInt
  taxProposedAt: BigInt
  pendingUtility: Bytes
  utilityProposedAt: BigInt

  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  metadata: MetadataSlot @derivedFrom(field: "slot")
  deployEvent: SlotDeployedEvent @derivedFrom(field: "slot")
  purchases: [BoughtEvent!]! @derivedFrom(field: "slot")
  releases: [ReleasedEvent!]! @derivedFrom(field: "slot")
  liquidations: [LiquidatedEvent!]! @derivedFrom(field: "slot")
  priceUpdates: [PriceUpdatedEvent!]! @derivedFrom(field: "slot")
  deposits: [DepositedEvent!]! @derivedFrom(field: "slot")
  withdrawals: [WithdrawnEvent!]! @derivedFrom(field: "slot")
  settlements: [SettledEvent!]! @derivedFrom(field: "slot")
  taxCollections: [TaxCollectedEvent!]! @derivedFrom(field: "slot")
  moduleFees: [ModuleFeePaidEvent!]! @derivedFrom(field: "slot")
  taxUpdateProposals: [TaxUpdateProposedEvent!]! @derivedFrom(field: "slot")
  moduleUpdateProposals: [ModuleUpdateProposedEvent!]!
    @derivedFrom(field: "slot")
  pendingUpdateCancellations: [PendingUpdateCancelledEvent!]!
    @derivedFrom(field: "slot")
  metadataUpdates: [MetadataUpdatedEvent!]! @derivedFrom(field: "slot")
}

"""
The parsed contents of one IPFS file, keyed by its CID.

Fetched by a `file/ipfs` data source rather than inline in a chain handler, so
this entity is subject to that mechanism's rules: it is IMMUTABLE, it is
written only by `handleIpfsContent`, and no chain-based handler can read it.
Chain entities point AT it by CID — writing a reference is just writing an id,
which is allowed and is the pattern the file-data-source guide recommends.

One entity type for every metadata file the protocol indexes — module,
slot ad, feed — because they are all the same shape of JSON and a CID is a CID.
A consumer selects the fields its own file is expected to carry and ignores
the rest.

**It appears asynchronously.** The chain handler that spawns the fetch commits
in its own block; this row shows up whenever Graph Node manages to retrieve the
file, which may be several blocks later or — if the CID is unpinned and
unreachable — never. A query that follows the link immediately after an update
can legitimately find nothing there. That is the trade the migration makes: the
old `ipfs.cat` blocked the handler and returned null on timeout, silently
recording "no metadata" forever.
"""
type IpfsContent @entity(immutable: true) {
  id: ID! # the CID, exactly as handed to the file data source
  "Raw file bytes as a UTF-8 string. Null when the file is not valid JSON."
  json: String
  name: String
  description: String
  image: String
  banner: String
  externalLink: String
  "The `type` field, used by ad metadata — banner, native, video."
  adType: String
}

type Module @entity(immutable: false) {
  id: ID! # module address
  factory: Factory!
  verified: Boolean!
  name: String!
  version: String!
  feeBps: BigInt!
  moduleURI: String
  """
  Parsed `moduleURI` contents. Replaces the former `image` and `description`
  fields, which were populated by a blocking `ipfs.cat` in the chain handler.
  Null until the file is fetched, and for a `moduleURI` that is not IPFS.
  """
  metadata: IpfsContent
  totalFeesCollected: BigInt!
  feePayments: [ModuleFeePaidEvent!]! @derivedFrom(field: "module")
}

# ──────────────────────────────────────────
# Metadata (mutable, one per slot with a MetadataModule)
# ──────────────────────────────────────────

type MetadataSlot @entity(immutable: false) {
  id: ID! # slot address (same as Slot.id)
  slot: Slot!
  uri: String!
  cid: String # IPFS CID extracted from uri (null for inline JSON or non-IPFS URIs)
  # `rawJson` and `adType` are now INLINE-ONLY. A `uri` that is literal JSON is
  # not a file and needs no fetching, so it is still parsed here in the chain
  # handler. An IPFS `uri` leaves both null and populates `content` instead.
  # Read them as `content { json adType }` first, then fall back to these.
  rawJson: String
  adType: String
  "Parsed contents of `cid`. Null for inline JSON, and until the file arrives."
  content: IpfsContent
  updatedBy: Bytes! # last address that set the URI
  updateCount: BigInt! # total number of URI changes
  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  updatedTx: Bytes!
}

type MetadataUpdatedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  author: Account!
  updatedBy: Bytes! # raw address that set the URI (V1: tx.from, V2: event.updatedBy param)
  uri: String!
  cid: String # IPFS CID extracted from uri (null for inline JSON or non-IPFS URIs)
  # Inline-only, as on MetadataSlot above. IPFS content lives under `content`.
  rawJson: String
  adType: String
  "Parsed contents of `cid`. Null for inline JSON, and until the file arrives."
  content: IpfsContent
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

