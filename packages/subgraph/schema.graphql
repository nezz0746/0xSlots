# ──────────────────────────────────────────
# 0xSlots v3 Subgraph Schema
# One slot = one contract (BeaconProxy)
# ──────────────────────────────────────────

type Factory @entity(immutable: false) {
  id: ID! # factory proxy address
  slotCount: BigInt!
  modules: [Module!]! @derivedFrom(field: "factory")
}

enum AccountType {
  EOA
  CONTRACT
  DELEGATED
  SPLIT
}

type Account @entity(immutable: false) {
  id: ID! # address (lowercase)
  type: AccountType!
  slotsAsRecipient: [Slot!]! @derivedFrom(field: "recipientAccount")
  slotsAsOccupant: [Slot!]! @derivedFrom(field: "occupantAccount")
  slotCount: Int!
  occupiedCount: Int!
  # feed metadata activity
  metadataUpdateCount: BigInt!
  # hold aggregate (tax is per-slot since currency is immutable per slot)
  totalHoldTime: BigInt! # cumulative seconds holding any slot
  # per-slot breakdown
  slotInteractions: [AccountSlot!]! @derivedFrom(field: "account")
}

type AccountSlot @entity(immutable: false) {
  id: ID! # {accountAddress}-{slotAddress}
  account: Account!
  slot: Slot!
  metadataUpdateCount: BigInt!
  taxPaid: BigInt!
  holdTime: BigInt! # total seconds held this slot
  lastOccupiedAt: BigInt # null if not currently holding
  firstInteractedAt: BigInt!
  lastInteractedAt: BigInt!
}

type Currency @entity(immutable: true) {
  id: ID! # token address (lowercase)
  name: String
  symbol: String
  decimals: Int!
}

type Slot @entity(immutable: false) {
  id: ID! # slot contract address (lowercase)
  recipient: Bytes!
  recipientAccount: Account!
  currency: Currency!
  mutableTax: Boolean!
  mutableModule: Boolean!
  mutablePolicy: Boolean!
  manager: Bytes!
  taxPercentage: BigInt!
  module: Module
  liquidationBountyBps: BigInt!
  minDepositSeconds: BigInt!
  occupant: Bytes # null = vacant
  occupantAccount: Account # null = vacant
  isOccupied: Boolean! # mirrors occupant != null; sortable/filterable
  feed: Feed # null if this slot does not belong to a Feed
  price: BigInt!
  deposit: BigInt!
  collectedTax: BigInt!
  """Total tax ever paid into this slot, summed from TaxPaid.
  The denominator for an account's share; unlike collectedTax it
  only grows, since collecting drains the balance but not history."""
  taxPaidTotal: BigInt!
  totalCollected: BigInt!

  # ── v3 occupancy layer ───────────────────────────────────────────────────
  # Sourced from SlotConfiguredV3, which initializeV3/migrateSlotsV3 emit.
  # SlotDeployed predates both and carries neither.
  epochSeconds: BigInt!
  occupancyPolicy: Bytes # null = no policy, i.e. plain instant buy
  occupiedSince: BigInt!

  # Committed-but-not-yet-effective transfer (epochSeconds > 0 only).
  #
  # IMPORTANT FOR CONSUMERS: `occupant` above is the last MATERIALISED
  # occupant. Transfers apply lazily on-chain — nothing runs at the boundary —
  # so once `block.timestamp >= pendingEffectiveAt`, the chain already treats
  # `pendingBuyer` as the occupant while this entity still shows the old one,
  # until some transaction touches the slot.
  #
  # The subgraph cannot resolve this itself: GraphQL has no notion of "now" at
  # query time. Callers must compute effective occupancy client-side —
  # `@0xslots/sdk` exports `resolveEffectiveOccupancy` for exactly this.
  pendingBuyer: Bytes
  pendingEffectiveAt: BigInt
  pendingPrice: BigInt
  pendingDeposit: BigInt

  # Pending manager-proposed policy swap (applies on next ownership transition)
  pendingPolicy: Bytes
  hasPendingPolicy: Boolean!

  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  metadata: MetadataSlot @derivedFrom(field: "slot")
  deployEvent: SlotDeployedEvent @derivedFrom(field: "slot")
  purchases: [BoughtEvent!]! @derivedFrom(field: "slot")
  releases: [ReleasedEvent!]! @derivedFrom(field: "slot")
  liquidations: [LiquidatedEvent!]! @derivedFrom(field: "slot")
  priceUpdates: [PriceUpdatedEvent!]! @derivedFrom(field: "slot")
  deposits: [DepositedEvent!]! @derivedFrom(field: "slot")
  withdrawals: [WithdrawnEvent!]! @derivedFrom(field: "slot")
  settlements: [SettledEvent!]! @derivedFrom(field: "slot")
  taxCollections: [TaxCollectedEvent!]! @derivedFrom(field: "slot")
  moduleFees: [ModuleFeePaidEvent!]! @derivedFrom(field: "slot")
  taxUpdateProposals: [TaxUpdateProposedEvent!]! @derivedFrom(field: "slot")
  moduleUpdateProposals: [ModuleUpdateProposedEvent!]!
    @derivedFrom(field: "slot")
  pendingUpdateCancellations: [PendingUpdateCancelledEvent!]!
    @derivedFrom(field: "slot")
  metadataUpdates: [MetadataUpdatedEvent!]! @derivedFrom(field: "slot")
}

type Module @entity(immutable: false) {
  id: ID! # module address
  factory: Factory!
  verified: Boolean!
  name: String!
  version: String!
  feeBps: BigInt!
  moduleURI: String
  image: String
  description: String
  totalFeesCollected: BigInt!
  feePayments: [ModuleFeePaidEvent!]! @derivedFrom(field: "module")
}

# ──────────────────────────────────────────
# Metadata (mutable, one per slot with a MetadataModule)
# ──────────────────────────────────────────

type MetadataSlot @entity(immutable: false) {
  id: ID! # slot address (same as Slot.id)
  slot: Slot!
  uri: String!
  cid: String # IPFS CID extracted from uri (null for inline JSON or non-IPFS URIs)
  rawJson: String # full JSON content (from IPFS or inline), null if fetch failed
  adType: String # parsed "type" field from JSON (e.g. "banner", "native", "video")
  updatedBy: Bytes! # last address that set the URI
  updateCount: BigInt! # total number of URI changes
  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  updatedTx: Bytes!
}

type MetadataUpdatedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  author: Account!
  updatedBy: Bytes! # raw address that set the URI (V1: tx.from, V2: event.updatedBy param)
  uri: String!
  cid: String # IPFS CID extracted from uri (null for inline JSON or non-IPFS URIs)
  rawJson: String # full JSON content (from IPFS or inline), null if fetch failed
  adType: String # parsed "type" field from JSON
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

# ──────────────────────────────────────────
# Event Entities (immutable)
# ──────────────────────────────────────────

type SlotDeployedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  recipient: Bytes!
  currency: Currency!
  manager: Bytes!
  mutableTax: Boolean!
  mutableModule: Boolean!
  mutablePolicy: Boolean!
  taxPercentage: BigInt!
  module: Bytes!
  liquidationBountyBps: BigInt!
  minDepositSeconds: BigInt!
  deployer: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type BoughtEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  buyer: Bytes!
  previousOccupant: Bytes!
  price: BigInt!
  deposit: BigInt!
  selfAssessedPrice: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type ReleasedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  occupant: Bytes!
  refund: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type LiquidatedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  liquidator: Bytes!
  occupant: Bytes!
  bounty: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type PriceUpdatedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  oldPrice: BigInt!
  newPrice: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type DepositedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  depositor: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type WithdrawnEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  occupant: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type SettledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  taxOwed: BigInt!
  taxPaid: BigInt!
  depositRemaining: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
One tax payment, attributed to the address that paid it.

`SettledEvent` carries the same amounts but not the payer, so it cannot be
reduced to a per-address ledger. This can, and it is the contract's own
statement rather than an inference from event ordering.
"""
type TaxPaidEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  account: Account!
  accountSlot: AccountSlot!
  currency: Currency!
  taxOwed: BigInt!
  """Actually taken from the deposit. Diverges from taxOwed when the occupant
  went insolvent, since the charge is capped at the remaining deposit — this is
  the figure to use for contribution accounting, never taxOwed."""
  taxPaid: BigInt!
  """False when the payer disagreed with the occupant the subgraph had on
  record. Always false today; a true value means the ordering assumption behind
  the pre-TaxPaid attribution has broken and older totals are suspect."""
  matchedOccupant: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type TaxCollectedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  recipient: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type ModuleFeePaidEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  module: Module!
  amount: BigInt!
  feeBps: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type TaxUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPercentage: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type ModuleUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newModule: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type PendingUpdateCancelledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

# ──────────────────────────────────────────
# FeedHub / Feed (beacon-proxy feeds, each with its own slots)
# ──────────────────────────────────────────

type FeedHub @entity(immutable: false) {
  id: ID! # hub address
  feedCount: BigInt!
  feeds: [Feed!]! @derivedFrom(field: "hub")
}

type Feed @entity(immutable: false) {
  id: ID! # feed proxy address
  hub: FeedHub!
  index: BigInt!
  owner: Bytes!
  onchainName: String! # Feed.name()
  metadataURI: String!
  recipient: Bytes!
  slotCount: BigInt!
  # resolved from metadataURI JSON:
  metadataName: String
  description: String
  image: String
  banner: String
  externalLink: String
  metadataRaw: String
  metadataCid: String
  displayName: String! # metadataName ?? onchainName
  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  slots: [Slot!]! @derivedFrom(field: "feed")
}

type FeedCreatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  hub: Bytes!
  owner: Bytes!
  index: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedNameUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  name: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedMetadataURIUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  uri: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedRecipientUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  recipient: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedSlotAddedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  slot: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedSlotRemovedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  slot: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ──────────────────────────────────────────
# ERC721Slots (Harberger NFT Collections)
# ──────────────────────────────────────────

type NFTCollection @entity(immutable: false) {
  id: ID! # collection contract address
  name: String!
  symbol: String!
  creator: Bytes!
  factory: Bytes!
  currency: Currency!
  taxPercentage: BigInt!
  totalSupply: BigInt!
  tokens: [NFTToken!]! @derivedFrom(field: "collection")
  createdAt: BigInt!
  createdTx: Bytes!
}

type NFTToken @entity(immutable: false) {
  id: ID! # collection-tokenId
  collection: NFTCollection!
  tokenId: BigInt!
  slot: Slot!
  uri: String!
  mintedAt: BigInt!
  mintedTx: Bytes!
}

# ═══════════════════════════════════════════════════════════════════════════
# v3 OCCUPANCY LAYER
# ═══════════════════════════════════════════════════════════════════════════

"""
A buy that committed but has not yet taken effect. On an epoch slot, `buy()`
escrows funds and schedules the handover for the next boundary; the matching
BoughtEvent fires later, in whatever transaction happens to materialise it.
"""
type TransferScheduledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  buyer: Bytes!
  effectiveAt: BigInt!
  price: BigInt!
  deposit: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Operator delegation. An operator may selfAssess and topUp on the occupant's
behalf; it may never withdraw or release.
"""
type OperatorSetEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  occupant: Bytes!
  operator: Bytes!
  approved: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Current operator approvals, keyed slot-occupant-operator.
"""
type SlotOperator @entity(immutable: false) {
  id: ID!
  slot: Slot!
  occupant: Bytes!
  operator: Bytes!
  approved: Boolean!
  updatedAt: BigInt!
}

type PolicyUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPolicy: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type PolicyUpdateAppliedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPolicy: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
A refund that could not be pushed (e.g. a blocklisting currency) and was
credited for later claim instead. A non-zero balance here means someone is
owed money by the slot.
"""
type RefundCreditedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  account: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type RefundClaimedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  account: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Outstanding claimable refund balance per slot-account.
"""
type SlotRefund @entity(immutable: false) {
  id: ID!
  slot: Slot!
  account: Bytes!
  credited: BigInt!
  claimed: BigInt!
  outstanding: BigInt!
  updatedAt: BigInt!
}
