  blockNumber: BigInt!
  tx: Bytes!
}

type PendingUpdateCancelledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Every propose, cancel and apply, tagged with the dimension it touched.

One entity rather than three because the contract emits one event shape for
all of it. The older per-domain events cannot be reduced into pending state:
PendingUpdateApplied carries both tax and utility on every apply — filling the
unchanged one in from current state, so a reader sees a utility "change" to
the value it already had — and PendingUpdateCancelled carries nothing at all.
Those are kept for historical continuity; this is the one to query.
"""
type PendingUpdateEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  "0 = tax, 1 = utility, 2 = policy. Matches the Solidity enum."
  kind: Int!
  "proposed | cancelled | applied"
  action: String!
  """
  The proposed value, widened to 32 bytes: raw basis points for tax, the
  left-padded address for utility and policy. Null on a cancel — nothing was
  set, only cleared.
  """
  value: Bytes
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

# ──────────────────────────────────────────
# FeedHub / Feed (beacon-proxy feeds, each with its own slots)
# ──────────────────────────────────────────

type FeedHub @entity(immutable: false) {
  id: ID! # hub address
  feedCount: BigInt!
  feeds: [Feed!]! @derivedFrom(field: "hub")
}

type Feed @entity(immutable: false) {
  id: ID! # feed proxy address
  hub: FeedHub!
  index: BigInt!
  owner: Bytes!
  onchainName: String! # Feed.name()
  metadataURI: String!
  recipient: Bytes!
  slotCount: BigInt!
  # Resolved from metadataURI JSON, INLINE ONLY — an IPFS metadataURI populates
  # `metadata` instead, because the file is now fetched asynchronously and a
  # file data source cannot write back to this entity.
  metadataName: String
  description: String
  image: String
  banner: String
  externalLink: String
  metadataRaw: String
  metadataCid: String
  "Parsed contents of `metadataCid`. Null for inline JSON, and until it arrives."
  metadata: IpfsContent
  """
  `metadataName ?? onchainName`, resolved when the event was handled.

  For a feed whose metadataURI is IPFS this is now always `onchainName`: the
  name lives in a file that had not been fetched yet, and the file data source
  is forbidden from updating this entity afterwards. Prefer
  `metadata { name }` and fall back to this.
  """
  displayName: String!
  createdAt: BigInt!
  createdTx: Bytes!
  updatedAt: BigInt!
  slots: [Slot!]! @derivedFrom(field: "feed")
}

type FeedCreatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  hub: Bytes!
  owner: Bytes!
  index: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedNameUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  name: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedMetadataURIUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  uri: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedRecipientUpdatedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  recipient: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedSlotAddedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  slot: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type FeedSlotRemovedEvent @entity(immutable: true) {
  id: ID!
  feed: Feed!
  slot: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ──────────────────────────────────────────
# ERC721Slots (Harberger NFT Collections)
# ──────────────────────────────────────────

type NFTCollection @entity(immutable: false) {
  id: ID! # collection contract address
  name: String!
  symbol: String!
  creator: Bytes!
  factory: Bytes!
  currency: Currency!
  taxPercentage: BigInt!
  totalSupply: BigInt!
  tokens: [NFTToken!]! @derivedFrom(field: "collection")
  createdAt: BigInt!
  createdTx: Bytes!
}

type NFTToken @entity(immutable: false) {
  id: ID! # collection-tokenId
  collection: NFTCollection!
  tokenId: BigInt!
  slot: Slot!
  uri: String!
  mintedAt: BigInt!
  mintedTx: Bytes!
}

# ═══════════════════════════════════════════════════════════════════════════
# v3 OCCUPANCY LAYER
# ═══════════════════════════════════════════════════════════════════════════

"""
A buy that committed but has not yet taken effect. On an epoch slot, `buy()`
escrows funds and schedules the handover for the next boundary; the matching
BoughtEvent fires later, in whatever transaction happens to materialise it.
"""
type TransferScheduledEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  buyer: Bytes!
  effectiveAt: BigInt!
  price: BigInt!
  deposit: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Operator delegation. An operator may selfAssess and topUp on the occupant's
behalf; it may never withdraw or release.
"""
type OperatorSetEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  occupant: Bytes!
  operator: Bytes!
  approved: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Current operator approvals, keyed slot-occupant-operator.
"""
type SlotOperator @entity(immutable: false) {
  id: ID!
  slot: Slot!
  occupant: Bytes!
  operator: Bytes!
  approved: Boolean!
  updatedAt: BigInt!
}

type PolicyUpdateProposedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPolicy: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type PolicyUpdateAppliedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  newPolicy: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
A refund that could not be pushed (e.g. a blocklisting currency) and was
credited for later claim instead. A non-zero balance here means someone is
owed money by the slot.
"""
type RefundCreditedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  account: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

type RefundClaimedEvent @entity(immutable: true) {
  id: ID!
  slot: Slot!
  currency: Currency!
  account: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  tx: Bytes!
}

"""
Outstanding claimable refund balance per slot-account.
"""
type SlotRefund @entity(immutable: false) {
  id: ID!
  slot: Slot!
  account: Bytes!
  credited: BigInt!
  claimed: BigInt!
  outstanding: BigInt!
  updatedAt: BigInt!
}
