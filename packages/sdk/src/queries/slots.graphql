# Ponder-native slot queries.
#
# Shape differences from the subgraph these replace:
#   * plural fields return { items, totalCount, pageInfo } instead of a bare list
#   * `first`/`skip` are `limit`/`offset`, plus cursor `after`/`before`
#   * foreign keys are scalar columns; the joined row is the `*Ref` sibling
#     (`module` is an address, `moduleRef` is the row)
#   * every row carries `chainId`, because one deployment indexes every chain
#   * there is no `block:` argument — ponder has no time-travel query

fragment SlotFields on slot {
  id
  chainId
  recipient
  recipientAccountRef {
    id
    type
    slotCount
    occupiedCount
  }
  currency
  currencyRef {
    id
    name
    symbol
    decimals
  }
  manager
  mutableTax
  mutableModule
  mutablePolicy
  taxPercentage
  module
  moduleRef {
    id
    verified
    name
    version
    feeBps
    metadataURI
    image
    description
    totalFeesCollected
  }
  occupant
  occupantAccountRef {
    id
    type
    slotCount
    occupiedCount
  }
  isOccupied
  occupiedSince
  price
  deposit
  collectedTax
  taxPaidTotal
  totalCollected
  liquidationBountyBps
  minDepositSeconds

  # Occupancy layer.
  occupancyPolicy

  # Pending updates, one per dimension. NULL means nothing is queued — which is
  # NOT the zero address: "remove the utility" and "drop the policy" are both
  # changes someone deliberately queued. The subgraph's `hasPendingPolicy`
  # boolean is gone; `pendingPolicy != null` says the same thing.
  pendingTaxPercentage
  taxProposedAt
  pendingUtility
  utilityProposedAt
  pendingPolicy
  policyProposedAt

  createdAt
  createdTx
  updatedAt
}

query GetSlots(
  $limit: Int
  $offset: Int
  $after: String
  $before: String
  $orderBy: String
  $orderDirection: String
  $where: slotFilter
) {
  slots(
    limit: $limit
    offset: $offset
    after: $after
    before: $before
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    items {
      ...SlotFields
    }
  }
}

query GetSlot($id: String!) {
  slot(id: $id) {
    ...SlotFields
  }
}

query GetSlotsByRecipient(
  $recipient: String!
  $chainId: Int
  $limit: Int
  $offset: Int
) {
  slots(
    where: { recipient: $recipient, chainId: $chainId }
    limit: $limit
    offset: $offset
    orderBy: "createdAt"
    orderDirection: "desc"
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...SlotFields
    }
  }
}

query GetSlotsByOccupant(
  $occupant: String!
  $chainId: Int
  $limit: Int
  $offset: Int
) {
  slots(
    where: { occupant: $occupant, chainId: $chainId }
    limit: $limit
    offset: $offset
    orderBy: "occupiedSince"
    orderDirection: "desc"
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...SlotFields
    }
  }
}

query GetSlotsWithMetadata(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
  $where: slotFilter
) {
  slots(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...SlotFields
      metadata {
        id
        uri
        cid
        rawJson
        adType
        updatedBy
        updateCount
        updatedAt
      }
    }
  }
}
