fragment MetadataSlotFields on metadataSlot {
  id
  chainId
  slot
  uri
  cid
  rawJson
  adType
  updatedBy
  updateCount
  createdAt
  createdTx
  updatedAt
  updatedTx
}

query GetMetadataSlots(
  $limit: Int
  $offset: Int
  $after: String
  $orderBy: String
  $orderDirection: String
  $where: metadataSlotFilter
) {
  metadataSlots(
    limit: $limit
    offset: $offset
    after: $after
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...MetadataSlotFields
    }
  }
}

query GetMetadataSlot($id: String!) {
  metadataSlot(id: $id) {
    ...MetadataSlotFields
    slotRef {
      id
      occupant
      recipient
      price
    }
  }
}

# Two hops: metadata is keyed by slot, and "whose slot" lives on the slot row.
# The subgraph could express this as a nested filter; ponder filters on scalar
# columns only, so the caller resolves the slot ids first and passes them in.
query GetMetadataSlotsBySlots($slots: [String!], $limit: Int) {
  metadataSlots(where: { slot_in: $slots }, limit: $limit) {
    totalCount
    items {
      ...MetadataSlotFields
    }
  }
}

query GetMetadataUpdatedEvents(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
  $where: metadataUpdatedEventFilter
) {
  metadataUpdatedEvents(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      id
      chainId
      slot
      author
      authorRef {
        id
        type
      }
      updatedBy
      uri
      cid
      rawJson
      adType
      timestamp
      blockNumber
      tx
    }
  }
}
