fragment AccountFields on account {
  id
  type
  slotCount
  metadataUpdateCount
  totalHoldTime
  # Bounded on purpose. The subgraph exposed these as unbounded @derivedFrom
  # lists on every account read; here they are pages, so a recipient with
  # thousands of slots does not turn an account lookup into a table scan.
  slotsAsRecipient(limit: 500) {
    totalCount
    items {
      id
      occupant
    }
  }
}

query GetAccount($id: String!) {
  account(id: $id) {
    ...AccountFields
  }
}

query GetAccounts(
  $limit: Int
  $offset: Int
  $after: String
  $orderBy: String
  $orderDirection: String
  $where: accountFilter
) {
  accounts(
    limit: $limit
    offset: $offset
    after: $after
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...AccountFields
    }
  }
}

# The subgraph put `slotsAsRecipient` / `slotsAsOccupant` inline on Account via
# @derivedFrom. Ponder can nest them too, but they are unbounded lists on an
# account with many slots, so they live behind their own paginated query rather
# than riding along on every account read.
query GetAccountWithSlots($id: String!, $limit: Int, $chainId: Int) {
  account(id: $id) {
    ...AccountFields
  }
  asRecipient: slots(
    where: { recipient: $id, chainId: $chainId }
    limit: $limit
    orderBy: "createdAt"
    orderDirection: "desc"
  ) {
    totalCount
    items {
      id
      chainId
      occupant
      isOccupied
      price
    }
  }
  asOccupant: slots(
    where: { occupant: $id, chainId: $chainId }
    limit: $limit
    orderBy: "occupiedSince"
    orderDirection: "desc"
  ) {
    totalCount
    items {
      id
      chainId
      price
      deposit
      occupiedSince
    }
  }
}

# ── Per-chain recipient counts ───────────────────────────────────────────────
#
# `account` has no `chainId` — one row per address, totals summed across every
# chain — so `GetAccounts` cannot answer "who receives on THIS chain". It used
# to be asked to anyway, and the explorer's recipient list showed base-sepolia's
# recipients while base was selected, with their base-sepolia counts.
#
# `accountChain` is the chain-scoped mirror. `accountRef` is included so one
# request still yields the address type (EOA / SPLIT / …) the list renders.
fragment AccountChainFields on accountChain {
  account
  chainId
  # Slots where this account is the RECIPIENT, and how many of those are
  # currently occupied. These two form the occupancy ratio.
  slotCount
  occupiedAsRecipient
  # Slots this account OCCUPIES. A different role entirely — pairing it with
  # `slotCount` puts two roles in one ratio and reads as occupancy.
  occupiedCount
  accountRef {
    id
    type
  }
}

query GetAccountChains(
  $limit: Int
  $offset: Int
  $after: String
  $orderBy: String
  $orderDirection: String
  $where: accountChainFilter
) {
  accountChains(
    limit: $limit
    offset: $offset
    after: $after
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...AccountChainFields
    }
  }
}
