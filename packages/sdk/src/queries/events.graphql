# Per-address tax attribution. `taxPaid` is the figure that means money moved —
# it is capped by the remaining deposit, so it falls short of `taxOwed` when an
# occupant is going insolvent. `matchedOccupant` is a tripwire: false means the
# payer disagreed with the occupant on record.
query GetTaxPaidEvents(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
  $where: taxPaidEventFilter
) {
  taxPaidEvents(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      id
      chainId
      slot
      currency
      occupant
      taxOwed
      taxPaid
      matchedOccupant
      timestamp
      blockNumber
      tx
    }
  }
}

