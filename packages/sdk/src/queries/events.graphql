# ── Refund credits ──
#
# A refund that could not be pushed and was credited for later claim instead.
# A non-zero `balance` means the slot owes someone money.

query GetSlotRefunds($limit: Int, $where: slotRefundFilter) {
  slotRefunds(where: $where, limit: $limit) {
    totalCount
    items {
      slot
      account
      chainId
      currency
      credited
      claimed
      balance
      updatedAt
    }
  }
}

# ── Operators ──

query GetSlotOperators($limit: Int, $where: slotOperatorFilter) {
  slotOperators(where: $where, limit: $limit) {
    totalCount
    items {
      slot
      occupant
      operator
      chainId
      approved
      updatedAt
    }
  }
}

# ── Cross-type feeds ──
#
# Ponder resolves every root field in one round trip, same as the subgraph did.
# There is still no cross-type ordering: the caller merges and sorts by
# timestamp.

query GetRecentEvents($limit: Int, $chainId: Int) {
  slotDeployedEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      recipient
      deployer
      timestamp
      tx
    }
  }
  boughtEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      buyer
      previousOccupant
      price
      selfAssessedPrice
      deposit
      timestamp
      tx
    }
  }
  releasedEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      occupant
      refund
      timestamp
      tx
    }
  }
  liquidatedEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      liquidator
      occupant
      bounty
      timestamp
      tx
    }
  }
  priceUpdatedEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      oldPrice
      newPrice
      timestamp
      tx
    }
  }
  taxCollectedEvents(
    limit: $limit
    where: { chainId: $chainId }
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      chainId
      slot
      recipient
      amount
      timestamp
      tx
    }
  }
}

query GetSlotActivity($slot: String!, $limit: Int) {
  boughtEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      buyer
      previousOccupant
      price
      selfAssessedPrice
      deposit
      timestamp
      tx
    }
  }
  releasedEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      occupant
      refund
      timestamp
      tx
    }
  }
  liquidatedEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      liquidator
      occupant
      bounty
      timestamp
      tx
    }
  }
  priceUpdatedEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      oldPrice
      newPrice
      timestamp
      tx
    }
  }
  depositedEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      depositor
      amount
      timestamp
      tx
    }
  }
  withdrawnEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      occupant
      amount
      timestamp
      tx
    }
  }
  taxPaidEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      occupant
      taxOwed
      taxPaid
      matchedOccupant
      timestamp
      tx
    }
  }
  taxCollectedEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      recipient
      amount
      timestamp
      tx
    }
  }
  pendingUpdateEvents(
    where: { slot: $slot }
    limit: $limit
    orderBy: "timestamp"
    orderDirection: "desc"
  ) {
    items {
      id
      kind
      action
      value
      timestamp
      tx
    }
  }
}
