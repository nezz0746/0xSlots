# ── Shared fragments ──

fragment CurrencyFields on currency {
  id
  name
  symbol
  decimals
}

# ── Single-type event feeds ──

query GetSlotDeployedEvents(
  $limit: Int
  $offset: Int
  $after: String
  $orderBy: String
  $orderDirection: String
  $where: slotDeployedEventFilter
) {
  slotDeployedEvents(
    limit: $limit
    offset: $offset
    after: $after
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      id
      chainId
      slot
      recipient
      currency
      currencyRef {
        ...CurrencyFields
      }
      manager
      mutableTax
      mutableModule
      mutablePolicy
      taxPercentage
      module
      occupancyPolicy
      liquidationBountyBps
      minDepositSeconds
      deployer
      timestamp
      blockNumber
      tx
    }
  }
}

