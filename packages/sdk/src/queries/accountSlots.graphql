fragment AccountSlotFields on accountSlot {
  account
  slot
  chainId
  metadataUpdateCount
  taxPaid
  holdTime
  lastOccupiedAt
  firstInteractedAt
  lastInteractedAt
}

# Composite primary key — the subgraph's synthetic "{account}-{slot}" id is gone.
query GetAccountSlot($account: String!, $slot: String!) {
  accountSlot(account: $account, slot: $slot) {
    ...AccountSlotFields
    accountRef {
      id
      type
    }
    slotRef {
      id
      price
      isOccupied
    }
  }
}

query GetAccountSlots(
  $limit: Int
  $offset: Int
  $after: String
  $orderBy: String
  $orderDirection: String
  $where: accountSlotFilter
) {
  accountSlots(
    limit: $limit
    offset: $offset
    after: $after
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    items {
      ...AccountSlotFields
    }
  }
}
