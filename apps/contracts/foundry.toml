[profile.default]
# CREATE2 addresses must depend on CODE, and nothing else.
#
# solc appends a metadata hash to every contract's bytecode, and that hash covers
# the whole compilation unit — every imported source, the remappings, the
# settings. So a rebuild that changed nothing behavioural still moved the
# initcode, which moved the predicted CREATE2 address, which made the deploy
# script want to redeploy every implementation and re-point every proxy at
# byte-identical code.
#
# It was not hypothetical: `Slot` compiled to runtime bytes identical to the
# deployed ones apart from the trailing hash, and the upgrade gate reported a
# pending BEACON upgrade for it.
#
# The cost is explorer verification, which needs "metadata: none" selected to
# match. Worth it: a deterministic address is the entire premise of this deploy
# scheme.
bytecode_hash = "none"
cbor_metadata = false

# Required by openzeppelin-foundry-upgrades: it shells out to the OZ Upgrades
# CLI, which reads the AST and build-info to validate storage layout.
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./script" },
]
optimizer = true
optimizer_runs = 200
# via_ir needed for Feed.initialize's wide param list (legacy codegen hits
# stack-too-deep). NOTE: this compiles the whole repo through the IR pipeline,
# so re-verifying any already-deployed contract now requires `--via-ir`.
via_ir = true

[rpc_endpoints]
local = "http://localhost:8545"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
basesepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
optsepolia = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[etherscan]
sepolia = { key = "${API_KEY_ETHERSCAN}" }
base = { key = "${API_KEY_ETHERSCAN}" }
optsepolia = { key = "${API_KEY_ETHERSCAN}", url = "https://api-sepolia.optimistic.etherscan.io/api", chain = 11155420 }
basesepolia = { key = "${API_KEY_ETHERSCAN}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
arbitrum = { key = "${API_KEY_ARBISCAN}", url = "https://api.arbiscan.io/api", chain = 42161 }
optimism = { key = "${API_KEY_OPSCAN}" }


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
